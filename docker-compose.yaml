# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:3.1.8
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common: &airflow-common
  build:
    context:    .
    dockerfile: docker/Dockerfile.airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "${AIRFLOW_PARALLELISM:-2}"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-2}"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "${AIRFLOW_PARSING_PROCESSES:-1}"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW_USERNAME: "${AIRFLOW_USERNAME}"
    AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL}
    AIRFLOW__API__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth
    AIRFLOW__API__SECRET_KEY: "aqi_prediction_secret_key_2026"
    AIRFLOW__API_AUTH__JWT_SECRET: "aqi_prediction_jwt_secret_2026"
    AIRFLOW__API_AUTH__JWT_ISSUER: "airflow"
    AIRFLOW__SMTP__SMTP_HOST:     "sandbox.smtp.mailtrap.io"
    AIRFLOW__SMTP__SMTP_PORT:     "2525"
    AIRFLOW__SMTP__SMTP_USER:     "${MAILTRAP_USERNAME}"
    AIRFLOW__SMTP__SMTP_PASSWORD: "${MAILTRAP_PASSWORD}"
    AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: "airflow@aqi-prediction.local"
    AIRFLOW__SMTP__SMTP_SSL:      "false"
    AIRFLOW__SMTP__SMTP_STARTTLS: "false"
    MLFLOW_TRACKING_URI: http://mlflow:5000
    OPENAQ_API_KEY:       ${OPENAQ_API_KEY}
    AQICN_TOKEN:          ${AQICN_TOKEN}
    DATA_DIR:             /opt/airflow/data
    PYTHONPATH:           /opt/airflow
    FASTAPI_URL:          http://fastapi:8000
    SKIP_SARIMA:          "${SKIP_SARIMA:-true}"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - ./mlflow:/app/mlflow
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: aqi-prediction-postgres
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries:  5
    restart: unless-stopped

  # ── Airflow init ───────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: aqi-prediction-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        chown -R "${AIRFLOW_UID:-50000}:0" /app/mlflow/artifacts || true
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_USERNAME}" \
          --password "${AIRFLOW_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@aqi-prediction.local || true
        airflow pools set retrain_pool "${RETRAIN_POOL_SLOTS:-1}" "Limit concurrent city retraining tasks"
        echo "Airflow ready: ${AIRFLOW_USERNAME} / ${AIRFLOW_PASSWORD}"
    user: "0:0"
    restart: on-failure

  # ── Airflow webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: aqi-prediction-airflow-webserver
    command: api-server
    cpus: "${AIRFLOW_WEBSERVER_CPUS:-0.75}"
    mem_limit: "${AIRFLOW_WEBSERVER_MEM:-1g}"
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval:    30s
      retries:     5
      start_period: 60s
    restart: unless-stopped

  # ── Airflow scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: aqi-prediction-airflow-scheduler
    command: scheduler
    cpus: "${AIRFLOW_SCHEDULER_CPUS:-1.0}"
    # mem_limit: "${AIRFLOW_SCHEDULER_MEM:-2g}"
    restart: unless-stopped

  # ── Airflow DAG Processor ────────────────────────────────────────────────
  airflow-dag-processor:
    <<: *airflow-common
    container_name: aqi-prediction-airflow-dag-processor
    command: dag-processor
    cpus: "${AIRFLOW_DAG_PROCESSOR_CPUS:-0.5}"
    mem_limit: "${AIRFLOW_DAG_PROCESSOR_MEM:-1g}"
    restart: unless-stopped

  # ── MLflow ─────────────────────────────────────────────────────────────────
  mlflow:
    build:
      context:    .
      dockerfile: docker/Dockerfile.mlflow
    container_name: aqi-prediction-mlflow
    cpus: "${MLFLOW_CPUS:-0.75}"
    mem_limit: "${MLFLOW_MEM:-1.5g}"
    environment:
      MLFLOW_ALLOWED_HOSTS: "*"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/app/mlflow
    healthcheck:
      test:        ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval:    30s
      retries:     5
      start_period: 60s
    restart: unless-stopped

  # ── FastAPI ────────────────────────────────────────────────────────────────
  fastapi:
    build:
      context:    .
      dockerfile: docker/Dockerfile.api
    container_name: aqi-prediction-fastapi
    cpus: "${FASTAPI_CPUS:-0.50}"
    # mem_limit: "${FASTAPI_MEM:-2g}"
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_DIR:            /app/data
      MODELS_DIR:          /app/models
      AQICN_TOKEN:         ${AQICN_TOKEN}
      OPENAQ_API_KEY:      ${OPENAQ_API_KEY}
      PYTHONPATH:          /app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow:/app/mlflow
      - ./mlflow/artifacts:/mlflow/artifacts
      - ./scripts:/app/scripts
      - ./reports:/app/reports
      - ./src:/app/src
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:        ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval:    30s
      retries:     5
      start_period: 120s
    restart: unless-stopped

  # ── Streamlit frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context:    .
      dockerfile: docker/Dockerfile.frontend
    container_name: aqi-prediction-frontend
    cpus: "${FRONTEND_CPUS:-0.5}"
    mem_limit: "${FRONTEND_MEM:-1g}"
    ports:
      - "8501:8501"
    environment:
      FASTAPI_URL: http://fastapi:8000
    volumes:
      - ./src:/app/src
      - ./images:/app/images
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      retries:  5
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: aqi-prediction-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  # ── Alertmanager ─────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: aqi-prediction-alertmanager
    environment:
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD}
      ALERT_EMAIL:       ${AIRFLOW_ALERT_EMAIL}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.yml
        sed -i "s/__SMTP_USER__/$$MAILTRAP_USERNAME/g" /tmp/alertmanager.yml
        sed -i "s/__SMTP_PASS__/$$MAILTRAP_PASSWORD/g" /tmp/alertmanager.yml
        sed -i "s/__ALERT_EMAIL__/$$ALERT_EMAIL/g"     /tmp/alertmanager.yml
        /bin/alertmanager --config.file=/tmp/alertmanager.yml --web.external-url=http://localhost:9093
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: aqi-prediction-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
  prometheus-data:
  grafana-data:
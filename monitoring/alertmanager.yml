global:
  smtp_smarthost:     "sandbox.smtp.mailtrap.io:2525"
  smtp_from:          "aqi-alerts@aqi-prediction.local"
  smtp_auth_username: "__SMTP_USER__"
  smtp_auth_password: "__SMTP_PASS__"
  smtp_require_tls:   true

route:
  receiver:        "email"
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: email
      repeat_interval: 30m

receivers:
  - name: "email"
    email_configs:
      - to: "__ALERT_EMAIL__"
        send_resolved: true
        headers:
          subject: "[AQI Prediction] {{ .Status | toUpper }} - {{ range .Alerts }}{{ .Labels.alertname }} {{ end }}"
        text: |
          {{ range .Alerts }}
          Alert:    {{ .Annotations.summary }}
          Details:  {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Time:     {{ .StartsAt }}
          {{ end }}